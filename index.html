<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Sarvam AI</title>

<link
rel="stylesheet"
href="style.css"
/>

</head>

<body>

<div class="app-container">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <!-- LOGO -->

        <div class="logo">

            <span class="logo-icon">
                🧠
            </span>

            <div>

                <h1>
                    Sarvam AI
                </h1>

            </div>

        </div>

        <!-- NEW CHAT -->

        <button id="new-chat-btn">

            ✏️ New Chat

        </button>

        <!-- SEARCH -->

        <input
        type="text"
        id="chat-search"
        placeholder="Search chats..."
        />

        <!-- MENU -->

        <nav class="menu">

            <div class="menu-item">
                📁 Projects
            </div>

            <div class="menu-item">
                ⚡ AI Tools
            </div>

            <div class="menu-item">
                📌 Pinned
            </div>

            <div class="menu-item">
                ⚙️ Settings
            </div>

        </nav>

        <!-- =========================
             KNOWLEDGE BASE
        ========================== -->

        <div class="rag-section">

            <div class="rag-header">

                <h3>
                    📚 Knowledge Base
                </h3>

                <label class="rag-toggle">

                    <input
                    type="checkbox"
                    id="rag-toggle"
                    checked
                    />

                    <span class="slider"></span>

                </label>

            </div>

            <button id="rag-upload-btn">

                + Upload Knowledge

            </button>

            <input
            type="file"
            id="rag-file-input"
            accept=".pdf,.doc,.docx,.txt"
            hidden
            />

            <div id="knowledge-list">

                <div class="knowledge-empty">

                    No documents uploaded

                </div>

            </div>

        </div>

        <!-- PINNED -->

        <div class="section-title">

            Pinned

        </div>

        <div id="pinned-chats">

        </div>

        <!-- RECENTS -->

        <div class="section-title">

            Recents

        </div>

        <div id="chat-history">

        </div>

    </aside>

    <!-- =========================
         MAIN CHAT AREA
    ========================== -->

    <main class="main-chat">

        <!-- TOP BAR -->

        <header class="top-bar">

            <h1>
                Sarvam AI
            </h1>

            <div class="top-controls">

                <select id="language-select">

                    <option value="English">
                        English
                    </option>

                    <option value="Hindi">
                        Hindi
                    </option>

                    <option value="Kannada">
                        Kannada
                    </option>

                    <option value="Tamil">
                        Tamil
                    </option>

                    <option value="Telugu">
                        Telugu
                    </option>

                    <option value="Malayalam">
                        Malayalam
                    </option>

                    <option value="Marathi">
                        Marathi
                    </option>

                </select>

                <div class="online-status">

                    <span class="online-dot"></span>

                    Online

                </div>

            </div>

        </header>

        <!-- CHAT AREA -->

        <div id="chat-container">

        </div>

        <!-- INPUT -->

        <div class="input-container">

            <button id="upload-btn">

                +

            </button>

            <input
            type="file"
            id="file-input"
            hidden
            />

            <input
            type="text"
            id="message-input"
            placeholder="Ask anything..."
            />

            <button id="voice-btn">

                🎤

            </button>

            <button id="send-btn">

                ➤

            </button>

        </div>

    </main>

</div>

<!-- =========================
     SCRIPTS
========================= -->

<script src="script.js"></script>

<script src="rag.js"></script>

</body>

</html>
